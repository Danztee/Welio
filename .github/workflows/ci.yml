name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: welio
          POSTGRES_PASSWORD: welio
          POSTGRES_DB: welio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U welio -d welio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WELIO_TEST_DATABASE_URL: postgres://welio:welio@127.0.0.1:5432/welio_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check migration pairs
        run: make check-migrations
      - name: Go formatting and imports
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -p 1 -count=1 ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: welio
          POSTGRES_PASSWORD: welio
          POSTGRES_DB: welio_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U welio -d welio_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WELIO_TEST_DATABASE_URL: postgres://welio:welio@127.0.0.1:5432/welio_browser_test?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API contract
        working-directory: .
        run: make contracts-check
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image-test
